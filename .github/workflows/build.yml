name: build

# FR-25 / the Definition of Done: unit + fixture tests green on the win/linux/mac matrix.
# The tests run against fakes and fixtures; the egress job separately proves NFR-02 (no network).
# Nothing here touches a real user's files: the kill test and fixtures use their own temp roots.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    # 3 OS x 2 arch (T-018 acceptance: "Suite green on all six cells").
    #
    # The arm64 cells run on GitHub-hosted arm64 runners. Requesting an arm64 SDK on an x64 runner
    # does not create arm64 coverage: setup-dotnet's architecture input selects which SDK to install,
    # but an x64 kernel cannot execute the arm64 test host. The "Verify the SDK matches the cell"
    # step makes a silently-x64 cell fail instead of letting the arm64 claim become decoration.
    name: ${{ matrix.os }} · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-24.04
            rid: linux-x64
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macOS
            arch: x64
            runner: macos-15-intel
            rid: osx-x64
          - os: macOS
            arch: arm64
            runner: macos-15
            rid: osx-arm64
          - os: windows
            arch: x64
            runner: windows-2025
            rid: win-x64
          - os: windows
            arch: arm64
            runner: windows-11-arm
            rid: win-arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          architecture: ${{ matrix.arch }}

      - name: Verify the SDK matches the cell
        shell: bash
        run: |
          arch="${{ matrix.arch }}"
          rid="$(dotnet --info | tr -d '\r' | awk '/RID:/{print $2; exit}')"
          echo "cell: ${{ matrix.os }} / $arch (RID $rid)"
          if [[ "$rid" != *"-${arch}" ]]; then
            echo "::error::expected a $arch SDK in this cell, got $rid"
            exit 1
          fi
          dotnet --info | sed -n '1,12p'

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors is already on in Directory.Build.props; this makes the gate explicit
      # and fails the job on any analyzer warning rather than relying on build output parsing.
      - name: Build (warnings are errors)
        run: dotnet build -warnaserror --configuration Release

      # Category!=Network is load-bearing. This job's claim is that the shipped suite makes NO network
      # calls; the one test that deliberately dials out belongs to the egress job, which is where its
      # failure would mean something.
      - name: Test
        run: >
          dotnet test --configuration Release --no-build
          --filter 'Category!=Network'
          --logger "trx;LogFileName=tests.trx"
          --results-directory "${{ runner.temp }}/test-results"

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      # T-028 acceptance: "zero escapes across ≥ 100k generated cases in CI" and "suite mandatory on
      # every PR (CI gate)".
      #
      # A SEPARATE step, not a filter on the Test step above, so the escape result is a named and
      # individually visible outcome. A safety suite whose failure is buried among 900 others is a safety
      # suite nobody watches.
      #
      # The count is pinned here rather than left to the default, and EscapeSuiteScaleTests asserts the
      # floor — so speeding this job up cannot quietly turn a 100k-case claim into a 200-case one.
      - name: Escape suite (property-based safety gate)
        env:
          COPPICE_ESCAPE_CASES: '100000'
        run: >
          dotnet test --configuration Release --no-build
          --filter 'FullyQualifiedName~Coppice.Tests.Safety|Escape=E-7|Escape=E-10|Escape=E-12'
          --logger "trx;LogFileName=escape.trx"
          --results-directory "${{ runner.temp }}/escape-results"

      - name: Upload escape suite results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: escape-results-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/escape-results
          retention-days: 14

      # The golden tests assert the report is correct; this asserts the PINNED file is the one they
      # read. If the csproj copy step regressed, or a golden file were regenerated here instead of in a
      # review, the tests alone would pass against whatever the code emitted.
      - name: Verify golden reports are unchanged
        shell: bash
        run: bash scripts/verify-golden.sh Release

      # The publish path is part of the product, not a release-day script: this proves the binary,
      # its size budget, its docs and its cold start on the same six cells that run the tests.
      - name: Publish (framework-dependent single file)
        shell: bash
        run: bash scripts/publish.sh ${{ matrix.rid }}

      - name: Upload the published tool
        uses: actions/upload-artifact@v7
        with:
          name: coppice-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/test-results
          retention-days: 14

  egress:
    # NFR-02/NFR-03: the suite must pass with egress BLOCKED, and that must be demonstrated rather
    # than assumed.
    #
    # A blocked-egress run of a suite that never touches the network produces a green job whether or
    # not the isolation actually works. So this job runs EgressCanaryTests, which opens a real TCP
    # connection to 1.1.1.1:443 and asserts it FAILS. With no route it passes, and that pass is the
    # proof. If the isolation regresses, the canary fails and this job fails loudly instead of
    # reporting a green that means nothing.
    #
    # The isolation is a network namespace: `unshare --net` gives the test process tree an empty
    # network stack with only loopback. That is the same property `--network none` provides, without
    # depending on a container image pull or on the runtime's attach behaviour to surface output.
    name: egress blocked
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Restore into a path INSIDE the workspace. The namespace run inherits this path, and the
      # packages must be present before egress is removed.
      - name: Restore into a workspace-local package folder
        shell: bash
        run: |
          echo "EGRESS_PACKAGES=$GITHUB_WORKSPACE/.egress-packages" >> "$GITHUB_ENV"
          dotnet restore --packages "$GITHUB_WORKSPACE/.egress-packages"

      - name: Build against the offline package folder
        shell: bash
        run: |
          dotnet build --configuration Release --no-restore \
            -p:RestorePackagesPath="$EGRESS_PACKAGES"

      # BOTH test projects, not just Coppice.Tests. Coppice.ArchitectureTests is where the
      # "no assembly references a System.Net type" rule lives, so running the egress job without it
      # would leave the strictest network check unverified exactly where it matters.
      - name: Run the full suite with no route
        shell: bash
        run: |
          dotnet_bin="$(command -v dotnet)"
          dotnet_root="${DOTNET_ROOT:-$(dirname "$(readlink -f "$dotnet_bin")")}"

          # sudo resets the environment, so pass the paths explicitly rather than relying on
          # inheritance. EGRESS_RESULTS is expanded inside the namespace script.
          sudo -n unshare --net -- env \
            DOTNET_ROOT="$dotnet_root" \
            PATH="$dotnet_root:$PATH" \
            NUGET_PACKAGES="$GITHUB_WORKSPACE/.egress-packages" \
            EGRESS_WORKSPACE="$GITHUB_WORKSPACE" \
            EGRESS_RESULTS="$GITHUB_WORKSPACE/.egress-results" \
            DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1 \
            bash -c '
              set -euo pipefail
              cd "$EGRESS_WORKSPACE"
              ip link set lo up
              dotnet test tests/Coppice.Tests/Coppice.Tests.csproj \
                --configuration Release --no-build \
                --settings tests/egress.runsettings \
                --logger "trx;LogFileName=egress.trx" \
                --results-directory "$EGRESS_RESULTS"
              dotnet test tests/Coppice.ArchitectureTests/Coppice.ArchitectureTests.csproj \
                --configuration Release --no-build \
                --settings tests/egress.runsettings \
                --logger "trx;LogFileName=architecture.trx" \
                --results-directory "$EGRESS_RESULTS"
            '

      - name: Prove the canary is actually load-bearing
        shell: bash
        run: |
          # If the egress run had silently excluded the canary, the green above would prove nothing.
          # Confirm the canary actually executed, by name, inside that run.
          results=$(find "$GITHUB_WORKSPACE/.egress-results" -name 'egress.trx' | head -1)
          if [[ -z "$results" ]]; then
            echo "::error::the egress run produced no results file"
            exit 1
          fi
          if ! grep -q 'Egress_is_blocked_in_this_environment' "$results"; then
            echo "::error::the egress canary did not run — a green egress job without it proves nothing"
            exit 1
          fi
          echo "egress canary ran under unshare --net"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: egress-results
          path: ${{ github.workspace }}/.egress-results
          # The results directory is dot-prefixed, and upload-artifact skips hidden files by default.
          # Without this the canary still runs, but the TRX it proves is silently not archived.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  licence:
    # T-000 acceptance: `dotnet pack` emits license metadata without warnings.
    name: license metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Pack and verify the NuGet license expression survived
        run: |
          dotnet pack src/Coppice.Cli/Coppice.Cli.csproj --configuration Release --output out 2>/dev/null \
            || dotnet pack src/Coppice.Cli/Coppice.Cli.csproj --configuration Release --output out
          nuspec=$(unzip -p out/*.nupkg '*.nuspec')
          echo "$nuspec" | grep -q '<license type="expression">Apache-2.0</license>' \
            || { echo "::error::missing or wrong PackageLicenseExpression"; exit 1; }
          echo "Apache-2.0 license metadata present"
